# D1 - RCAEval RE2-OB (Online Boutique)
data:
  raw_root: data/raw/RE2-OB
  processed: data/processed/d1.pt
  grid_s: 15          # feature bucket, seconds (baked into the processed file)
  window_T: 20        # buckets per window (= 5 min); applied at load time
  edge_alpha: 0.5     # traffic-vs-error blend in e_ij; applied at load time

model:
  d_in: 13
  d_temp: 32          # paper
  d_spat: 32
  d_head: 32
  n_enc_layers: 2     # paper
  n_gat_layers: 2     # paper
  enc_heads: 4
  gat_heads: 4
  gat_hidden: 16
  dropout: 0.1
  pooling: mean

loss:
  lambda1: 0.1        # TCD weight; paper says results insensitive, value unstated
  lambda2: 0.2        # SCO weight; paper's stated best
  delta: 0.2          # TCD margin, unstated in paper
  m: 0.1              # SCO margin, unstated in paper
  tcd_as_written: false  # false = intuition-consistent orientation (see losses.py)

train:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 400
  batch_size: 20
  seed: 7
  eval_every: 5       # epochs between validation checks
  patience: 15        # val checks without improvement before stopping
